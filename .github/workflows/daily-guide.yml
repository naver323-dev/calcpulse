name: daily-guide

# One guide a day at 10:15 KST, committed only after npm test passes.
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Kept for the spare OpenAI-compatible slot of scripts/llm_fallback.py: if the chain is
  # reordered to "gemini,groq,github-models", the Actions token is what calls it.
  models: read

concurrency:
  group: daily-guide
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate, gate and publish
        env:
          # Free tiers only, no card anywhere. Gemini first, Groq when Gemini is out of
          # quota, OpenRouter :free models last. Any single key is enough to publish; a tier
          # without a key is skipped.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_guide.py --publish
